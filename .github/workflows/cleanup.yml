# One-off: runs once on the push that adds it, and is removed again right after.
name: Cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Release v1.0.0 (tag on main)
        run: |
          if gh release view v1.0.0 -R "$REPO" >/dev/null 2>&1; then echo "v1.0.0 exists"; else
            gh release create v1.0.0 -R "$REPO" --target "$GITHUB_SHA" --title "Blueprint 1.0.0" \
              --notes "The first version of the blueprint. See CHANGELOG.md."
          fi
      - name: Delete every branch but main (only when main has all its commits)
        run: |
          for b in $(gh api "repos/$REPO/branches" --paginate --jq '.[].name'); do
            [ "$b" = main ] && continue
            ahead="$(gh api "repos/$REPO/compare/main...$b" --jq .ahead_by)"
            if [ "$ahead" != 0 ]; then echo "::error::$b has $ahead commit(s) that are not in main; kept"; exit 1; fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b"
            echo "Deleted $b"
          done
          gh api "repos/$REPO/branches" --jq '.[].name'
